apiVersion: v1
kind: Service
metadata:
  name: comfyui-service
  labels:
    app: comfyui
spec:
  selector:
    app: comfyui
  ports:
  - port: 8848
    protocol: TCP
    targetPort: 8848
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comfyui-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=300
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:598982683772:certificate/bf06ddb4-2c9c-44a6-86ca-d63bb7dc7b34
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - comfyui.weareluca.ai
      secretName: dummy-secret-placeholder  # Required by k8s spec but ignored by AWS ALB controller
  rules:
    - host: comfyui.weareluca.ai
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: keda-add-ons-http-interceptor-proxy
              port:
                number: 8080
