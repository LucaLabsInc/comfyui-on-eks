apiVersion: v1
kind: PersistentVolume
metadata:
  name: comfyui-workflows-pv
spec:
  capacity:
    storage: 1200Gi # ignored, required
  accessModes:
    - ReadWriteMany # supported options: ReadWriteMany / ReadOnlyMany
  mountOptions:
    - allow-delete
    - region us-west-2
  csi:
    driver: s3.csi.aws.com # required
    volumeHandle: s3-csi-driver-volume-workflows # need to be unique
    volumeAttributes:
      bucketName: comfyui-workflows-598982683772-us-west-2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-workflows-pvc
spec:
  accessModes:
    - ReadWriteMany # supported options: ReadWriteMany / ReadOnlyMany
  storageClassName: "" # required for static provisioning
  resources:
    requests:
      storage: 1200Gi # ignored, required
  volumeName: comfyui-workflows-pv
